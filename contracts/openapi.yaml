openapi: 3.0.3
info:
  title: Otran API
  version: 0.1.0
  description: |
    Otran - agentic competitive-intelligence API.
    SOURCE OF TRUTH shared by backend (FastAPI) and frontend (React).
    Changing this file requires updating BOTH sides. Mock payloads live in contracts/samples.json.
    Core invariant: every Claim has at least one Evidence (quote + source + snapshot).
servers:
  - url: http://127.0.0.1:8000
tags:
  - name: analyses
  - name: evidence
  - name: system

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness + active LLM provider
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/analyses:
    post:
      tags: [analyses]
      summary: Start a new analysis (runs the agent pipeline asynchronously)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisCreate'
      responses:
        '202':
          description: Accepted; subscribe to /events for live progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
    get:
      tags: [analyses]
      summary: List analyses (newest first)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Analysis'

  /api/analyses/{analysisId}:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [analyses]
      summary: Get analysis status and metadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/analyses/{analysisId}/events:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [analyses]
      summary: Server-Sent Events stream of agent activity
      description: |
        Content-Type text/event-stream. Each message is `event: agent_event` with a JSON AgentEvent in `data:`.
        Final message is `event: done` with data `{"status":"completed"|"failed"}`.
        Late subscribers receive the full history first, then live events.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AgentEvent'

  /api/analyses/{analysisId}/matrix:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [analyses]
      summary: Comparison matrix (products x dimensions) with verification state per cell
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matrix'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/analyses/{analysisId}/changes:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [analyses]
      summary: Change feed (diffs vs previous snapshots), newest first
      parameters:
        - name: product_id
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/Severity'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Change'

  /api/analyses/{analysisId}/rerun:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    post:
      tags: [analyses]
      summary: Re-collect all sources and diff against the previous run
      responses:
        '202':
          description: Accepted; subscribe to /events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'

  /api/analyses/{analysisId}/report:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [analyses]
      summary: Generated analyst report
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, md]
            default: json
      responses:
        '200':
          description: json -> Report object; md -> text/markdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
            text/markdown:
              schema:
                type: string

  /api/analyses/{analysisId}/chat:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    post:
      tags: [analyses]
      summary: Ask a question; answers use verified claims only and must cite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'

  /api/claims/{claimId}:
    parameters:
      - name: claimId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [evidence]
      summary: A claim with all its evidence and verification detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/snapshots/{snapshotId}:
    parameters:
      - name: snapshotId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [evidence]
      summary: Stored page snapshot (clean text) for the evidence viewer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    Health:
      type: object
      required: [status, llm_provider]
      properties:
        status: { type: string, example: ok }
        llm_provider:
          type: string
          enum: [gemini, ollama]
          description: Currently active provider (switches to ollama on Gemini rate-limit)
        llm_model: { type: string }

    Severity:
      type: string
      enum: [low, medium, high]

    AgentName:
      type: string
      enum: [orchestrator, discovery, collector, extractor, verifier, diff, analyst, qa]

    AnalysisStatus:
      type: string
      enum: [queued, running, completed, failed]

    ProductInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url:
          type: string
          format: uri
          description: Homepage or main product URL (discovery finds the rest)
        extra_urls:
          type: array
          items: { type: string, format: uri }
          description: Optional hand-picked pages (pricing, docs, changelog)

    AnalysisCreate:
      type: object
      required: [our_product, competitors]
      properties:
        our_product:
          $ref: '#/components/schemas/ProductInput'
        competitors:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/ProductInput'
        dimensions:
          type: array
          items: { type: string }
          default: [pricing, features, integrations, limits, release_cadence]

    Product:
      type: object
      required: [id, name, role, url]
      properties:
        id: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [ours, competitor]
        url: { type: string }

    Analysis:
      type: object
      required: [id, status, created_at, products, dimensions]
      properties:
        id: { type: string }
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        run_number:
          type: integer
          description: Increments on each rerun
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        dimensions:
          type: array
          items: { type: string }
        stats:
          $ref: '#/components/schemas/AnalysisStats'

    AnalysisStats:
      type: object
      properties:
        sources_collected: { type: integer }
        claims_total: { type: integer }
        claims_verified: { type: integer }
        claims_contradicted: { type: integer }
        changes_detected: { type: integer }

    AgentEvent:
      type: object
      required: [id, ts, agent, level, message]
      properties:
        id: { type: integer, description: Monotonic per analysis }
        ts: { type: string, format: date-time }
        agent:
          $ref: '#/components/schemas/AgentName'
        step:
          type: string
          description: Short machine key, e.g. fetch_page, extract_pricing, verify_claim
        level:
          type: string
          enum: [info, success, warning, error]
        message: { type: string }
        product_id: { type: string, nullable: true }
        data:
          type: object
          additionalProperties: true
          description: Optional extras (url, claim_id, counts)

    Verification:
      type: object
      required: [status, confidence]
      properties:
        status:
          type: string
          enum: [verified, unverified, contradicted]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reason: { type: string }

    Evidence:
      type: object
      required: [id, quote, source_url, snapshot_id, captured_at]
      properties:
        id: { type: string }
        quote:
          type: string
          description: Exact text copied from the snapshot
        source_url: { type: string }
        source_type:
          type: string
          enum: [product_page, pricing, docs, release_notes, other]
        snapshot_id: { type: string }
        char_start: { type: integer, description: Offset of quote in snapshot text }
        char_end: { type: integer }
        captured_at: { type: string, format: date-time }

    Claim:
      type: object
      required: [id, product_id, dimension, statement, evidence, verification]
      properties:
        id: { type: string }
        product_id: { type: string }
        dimension: { type: string }
        statement:
          type: string
          description: Normalised factual statement
        data:
          type: object
          additionalProperties: true
          description: Optional structured form (e.g. tier, price, currency, period)
        evidence:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Evidence'
        verification:
          $ref: '#/components/schemas/Verification'
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    Snapshot:
      type: object
      required: [id, url, captured_at, content_hash, text]
      properties:
        id: { type: string }
        url: { type: string }
        source_type: { type: string }
        captured_at: { type: string, format: date-time }
        content_hash: { type: string }
        text: { type: string, description: Cleaned page text }

    MatrixCell:
      type: object
      required: [product_id, dimension, value, verification_status, confidence, claim_ids]
      properties:
        product_id: { type: string }
        dimension: { type: string }
        value:
          type: string
          description: Short display value for the cell
        verification_status:
          type: string
          enum: [verified, unverified, contradicted, missing]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        claim_ids:
          type: array
          items: { type: string }
        advantage:
          type: string
          enum: [ours, theirs, parity, unknown]
          description: Analyst agent's call relative to our product

    Matrix:
      type: object
      required: [analysis_id, products, dimensions, cells]
      properties:
        analysis_id: { type: string }
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        dimensions:
          type: array
          items: { type: string }
        cells:
          type: array
          items:
            $ref: '#/components/schemas/MatrixCell'

    Change:
      type: object
      required: [id, product_id, dimension, change_type, severity, summary, detected_at]
      properties:
        id: { type: string }
        product_id: { type: string }
        dimension: { type: string }
        change_type:
          type: string
          enum: [added, removed, modified]
        severity:
          $ref: '#/components/schemas/Severity'
        summary: { type: string }
        before: { type: string, nullable: true }
        after: { type: string, nullable: true }
        source_url: { type: string }
        detected_at: { type: string, format: date-time }
        claim_ids:
          type: array
          items: { type: string }

    Battlecard:
      type: object
      required: [competitor_id]
      properties:
        competitor_id: { type: string }
        strengths:
          type: array
          items: { type: string }
        weaknesses:
          type: array
          items: { type: string }
        counter_points:
          type: array
          items: { type: string }
        claim_ids:
          type: array
          items: { type: string }

    Gap:
      type: object
      required: [dimension, description, severity]
      properties:
        dimension: { type: string }
        description: { type: string }
        severity:
          $ref: '#/components/schemas/Severity'
        claim_ids:
          type: array
          items: { type: string }

    Report:
      type: object
      required: [analysis_id, generated_at, executive_summary, battlecards, gaps, markdown]
      properties:
        analysis_id: { type: string }
        generated_at: { type: string, format: date-time }
        executive_summary: { type: string }
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/Gap'
        battlecards:
          type: array
          items:
            $ref: '#/components/schemas/Battlecard'
        markdown:
          type: string
          description: Full report as Markdown (inline citations as [claim:c_001])

    ChatRequest:
      type: object
      required: [question]
      properties:
        question: { type: string }
        history:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content: { type: string }

    ChatResponse:
      type: object
      required: [answer, citations]
      properties:
        answer: { type: string }
        citations:
          type: array
          items:
            type: object
            required: [claim_id]
            properties:
              claim_id: { type: string }
              quote: { type: string }
              source_url: { type: string }
        insufficient_evidence:
          type: boolean
          description: True when verified claims could not support an answer
